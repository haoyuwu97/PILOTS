[general]
input = ../data/sample.dump
dt = 1.0
output_dir = ./_out_slab

[groups]
all = type:*
poly = type:1
filler = type:2

[measure.srdf]
enabled = true
type = slab_rdf
group = all
group_b = filler
axis = x
n_slab_bins = 4
n_r_bins = 8
r_max = 5.0
slab_align_recenter = true
halfcell_fold = true
target_center_frac = 0.5
anchor_group = poly
output = slab_rdf.dat

[measure.map]
enabled = true
type = 2d_map
group = all
axis_u = x
axis_v = y
slab_axis = x
n_u_bins = 4
n_v_bins = 4
mode = number
slab_align_recenter = true
halfcell_fold = true
target_center_frac = 0.5
anchor_group = poly
output = map2d.dat

[measure.ifex]
enabled = true
type = interface_excess
group = all
axis = x
n_bins = 6
mode = number
left_lo_frac = 0.0
left_hi_frac = 0.25
right_lo_frac = 0.75
right_hi_frac = 1.0
divide_frac = 0.5
slab_align_recenter = true
halfcell_fold = true
target_center_frac = 0.5
anchor_group = poly
output = interface_excess.dat

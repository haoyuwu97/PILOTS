[general]
input = ../data/sample_q.dump
dt = 1.0
output_dir = ./_out_bg_dielectric_partial_cover_allowed

[groups]
all = type:*
water = type:1
matrix = type:2

[measure.slab_bg]
enabled = true
type = slab_bg_dielectric
group = all
axis = z
n_bins = 6
temperature = 300.0
charge_field = q
entity_reference = geometric
slab_align_recenter = true
halfcell_fold = true
anchor_group = matrix
species_groups = water
background_groups = water
allow_partial_species_cover = true
output = slab_bg_dielectric_partial_cover_allowed.dat

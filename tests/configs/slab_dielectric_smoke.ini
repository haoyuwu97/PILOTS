[general]
input = ../data/sample_q.dump
dt = 1.0
output_dir = ./_out_slab_dielectric

[groups]
all = type:*
poly = type:1

[measure.slabdie]
enabled = true
type = slab_dielectric
group = all
axis = x
n_bins = 4
temperature = 300.0
charge_field = q
slab_align_recenter = true
halfcell_fold = true
target_center_frac = 0.5
anchor_group = poly
output = slab_dielectric.dat

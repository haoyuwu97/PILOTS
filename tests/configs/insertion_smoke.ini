[general]
input = ../data/sample.dump
dt = 1.0
output_dir = ./_out_insertion

[groups]
all = type:*
poly = type:1

[measure.acc_fold]
enabled = true
type = accessibility_profile
group = all
axis = x
n_bins = 8
probe_radius = 0.15
occluder_radius = 0.35
samples_plane = 4
samples_axis = 2
convergence_refine_factor = 2
slab_align_recenter = true
halfcell_fold = true
target_center_frac = 0.5
anchor_group = poly
reservoir_left_lo_frac = 0.0
reservoir_left_hi_frac = 0.25
output = acc_fold.dat

[measure.cond_rel]
enabled = true
type = conditional_widom_profile
group = all
axis = x
n_bins = 8
probe_radius = 0.15
occluder_radius = 0.35
energy_model = lj126
probe_sigma = 0.25
occluder_sigma = 0.25
probe_epsilon = 0.05
occluder_epsilon = 0.05
beta = 1.0
samples_plane = 4
samples_axis = 2
slab_align_recenter = true
halfcell_fold = true
target_center_frac = 0.5
anchor_group = poly
reservoir_left_lo_frac = 0.0
reservoir_left_hi_frac = 0.25
output = cond_rel.dat

[measure.cond_abs]
enabled = true
type = conditional_widom_profile
group = all
axis = x
n_bins = 8
probe_radius = 0.15
occluder_radius = 0.35
energy_model = lj126
probe_sigma = 0.25
occluder_sigma = 0.25
probe_epsilon = 0.05
occluder_epsilon = 0.05
beta = 1.0
samples_plane = 4
samples_axis = 2
slab_align_recenter = true
halfcell_fold = true
target_center_frac = 0.5
anchor_group = poly
reservoir_normalize = false
output = cond_abs.dat

[general]
input = ../data/sample_q.dump
dt = 1.0
output_dir = ./_out_fragment_dielectric

[groups]
all = type:*
water = type:1
matrix = type:2

[measure.slab_fragment]
enabled = true
type = slab_fragment_dielectric
group = all
axis = z
n_bins = 6
temperature = 300.0
charge_field = q
entity_reference = geometric
slab_align_recenter = true
halfcell_fold = true
anchor_group = matrix
output = slab_fragment_dielectric.dat
